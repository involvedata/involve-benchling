}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-entity:#8fb8ff; --c-entity-ink:#0b1f3a; --c-mixture:#4fd1e0; --c-mixture-ink:#062a30; --c-inventory:#c4a6ff; --c-inventory-ink:#25163f; --c-location:#8fd694; --c-location-ink:#0f2a15; --c-result:#ffa04d; --c-result-ink:#3a1a00}}
:root[data-theme="dark"]{--c-entity:#8fb8ff; --c-entity-ink:#0b1f3a; --c-mixture:#4fd1e0; --c-mixture-ink:#062a30; --c-inventory:#c4a6ff; --c-inventory-ink:#25163f; --c-location:#8fd694; --c-location-ink:#0f2a15; --c-result:#ffa04d; --c-result-ink:#3a1a00}
html,body{height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:13px;overflow:hidden}

@media (max-width:820px){ .main.pclosed{grid-template-columns:1fr;grid-template-rows:1fr auto} .panelrail{width:auto;flex-direction:row;justify-content:center;padding:8px;border-left:0;border-top:1px solid var(--line)} .panelrail .rl{writing-mode:horizontal-tb} }

.tabs{display:flex;gap:3px;margin-top:8px;background:var(--sunken);padding:3px;border-radius:8px;width:max-content;max-width:100%}

.search{position:relative}

.fl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fl li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;font-size:12px}
.sev{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.sev.high{color:var(--sev-high)}.sev.medium{color:var(--sev-medium)}.sev.low{color:var(--sev-low)}.sev.info{color:var(--sev-info)}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;margin:0}
.p{margin:6px 0 0;line-height:1.55;max-width:65ch}
.back{font-size:12px;margin-bottom:10px}
.legend{display:grid;gap:5px;font-size:12px}
.legend div{display:flex;gap:8px;align-items:center}
.ln{width:26px;height:0;border-top:1.6px solid var(--edge)}.ln.d{border-top-style:dashed}
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  aside{border-left:0;border-top:1px solid var(--line);max-height:42vh;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    <aside id="side"><button class="panelclose" id="panelclose" type="button" aria-controls="side" aria-label="Hide panel" title="Hide panel">»</button><div id="panel" aria-live="polite"></div></aside>
    <button class="panelrail" id="panelrail" type="button" aria-controls="side" aria-label="Show panel" title="Show panel" hidden><span aria-hidden="true">«</span><span class="rl">Details</span></button>
  </div>
</div>

<script id="erd-dagre">__DAGRE_JS__</script>
<script id="erd-main">
// The page's own markup, captured before anything changes it, for "Download HTML"
const PRISTINE_APP = document.querySelector('.app').outerHTML;
// All tenant data comes from erd.py (run_inspect.py --erd). Nothing below is tenant-specific.
const ERD = __ERD_JSON__;
const DATA = { meta: ERD.meta, nodes: ERD.nodes, findings: ERD.findings };

const CATS = {
  entity:   {label:'Entities',            long:'Registry entity schema',     v:'--c-entity'},
  inventory:{label:'Containers & racks',  long:'Container, box or plate schema', v:'--c-inventory'},
  location: {label:'Locations',           long:'Location schema',            v:'--c-location'},
  result:   {label:'Results',             long:'Result schema (organization-level)', v:'--c-result'},
};
const FAM = {entity_schema:'Entity',box_schema:'Box',container_schema:'Container',location_schema:'Location',
  matrix_plate_schema:'Matrix plate',well_plate_schema:'Well plate',result_schema:'Result'};
const ETYPE = {custom_entity:'Custom entity',dna_sequence:'DNA sequence',rna_sequence:'RNA sequence',
  aa_sequence:'AA sequence',dna_oligo:'DNA oligo',rna_oligo:'RNA oligo',oligo_duplex:'Oligo duplex',
  mixture:'Mixture',molecule:'Molecule',protein:'Protein'};
const etype = n => n.family==='entity_schema' && n.type ? (ETYPE[n.type]||n.type.replace(/_/g,' ')) : '';
const etypeTip = n => n.listedAs ? ` title="Benchling lists this schema as ${esc(ETYPE[n.listedAs]||n.listedAs)}; its items are ${esc(etype(n))}"` : '';
const KIND = {DropdownLink:'dropdown',CustomEntityLink:'entity link',MixtureLink:'mixture link',StorableLink:'storage link',
  EntryLink:'entry link',AttachmentLink:'attachment',LongText:'long text',Json:'JSON',Text:'text',Date:'date',
  Boolean:'yes/no',Integer:'integer',Decimal:'decimal',DnaSequenceLink:'DNA link',AaSequenceLink:'AA link',Ingredients:'mixture ingredients'};
const LINKISH = k => k==='Ingredients' || (/Link$/.test(k) && k!=='DropdownLink' && k!=='AttachmentLink');
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Mixtures are entities: they sit under Entities in the buttons and tiles, but keep their own teal card header
const colOf = n => n.cat==='entity' && n.type==='mixture' ? '--c-mixture' : CATS[n.cat].v;
const catOf = n => n.scope==='org' ? 'result' : n.family==='entity_schema' ? 'entity' : n.family==='location_schema' ? 'location' : 'inventory';

const HIDDEN = ERD.hidden || [];   // already removed by erd.py, listed on the page
// f.der: 'C' computed, 'S' snapshot (from derivationType); f.def: a computed field's definition, when supplied
const DDOPTS = ERD.dropdowns || {};   // dropdown name -> [[option name, archived], ...]
const openDD = new Set();
const ddList = name => { const o=DDOPTS[name]||[]; return `<div class="opts">${o.length?o.map(x=>`<span class="opt">${esc(x[0])}</span>`).join(''):'<span class="optnone">No options</span>'}</div>`; };
// One dropdown open at a time; its options show in a popover to the right of the card
function toggleDD(id,fi){ const k=id+':'+fi; const prev=[...openDD][0]; openDD.clear(); if(prev!==k) openDD.add(k);
  new Set([id, prev && prev.split(':')[0]].filter(Boolean)).forEach(x=>{ if(cardEls[x]) fillCard(cardEls[x],byId[x]); });
  drawEdges(); applyHighlight(); }
function closeDD(){ if(!openDD.size) return; const x=[...openDD][0].split(':')[0]; openDD.clear(); if(cardEls[x]) fillCard(cardEls[x],byId[x]); drawEdges(); applyHighlight(); }
function positionPop(){
  let pop=document.getElementById('ddpop');
  if(!pop){ pop=document.createElement('div'); pop.id='ddpop'; pop.className='ddpop'; pop.hidden=true; world.appendChild(pop); }
  const k=[...openDD][0]; if(!k){ pop.hidden=true; return; }
  const [id,fi]=k.split(':'); const el=cardEls[id], n=byId[id], f=n&&n.fields[+fi];
  if(!el||!f){ openDD.clear(); pop.hidden=true; return; }
  const r=el.querySelector(`.row[data-fi="${fi}"]`), p=state.pos[id];
  if(pop.dataset.k!==k){ const o=DDOPTS[f.dd]||[];
    pop.innerHTML=`<div class="pophd"><span class="kicker">${esc(f.n)} · dropdown</span><b>${esc(f.dd)}</b><span class="popn">${o.length} option${o.length===1?'':'s'}</span></div><ol class="opts">${o.length?o.map(x=>`<li>${esc(x[0])}</li>`).join(''):'<li class="optnone">No options</li>'}</ol>`;
    pop.dataset.k=k; }
  pop.hidden=false; pop.style.left=(p.x+el.offsetWidth+14)+'px'; pop.style.top=(p.y+(r?r.offsetTop-10:0))+'px';
}
const derTag = f => f.der ? `<span class="dv ${f.der==='C'?'c':'s'}" title="${f.der==='C'?(f.def?esc('Computed: '+f.def):'Computed: Benchling calculates this value from linked data'):'Snapshot: copies a value from a linked item when the record is created'}">${f.der==='C'?'ƒx':'snapshot'}</span>` : '';
// Mixture ingredient links arrive as fields of kind 'Ingredients' (added by hand in the extras file)
const nodes = DATA.nodes.map(n => ({...n, cat:catOf(n)}));
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
const allEdges = [];
// no arrow for a computed field that points back at its own schema
nodes.forEach(n => n.fields.forEach((f,i) => { if (f.to && byId[f.to] && !(f.der==='C' && f.to===n.id)) allEdges.push({from:n.id,to:f.to,fi:i,req:f.req,label:f.n}); }));
// Inventory hierarchy (which location or box holds which), from the extras file. The crawl does not read it.
const byName = Object.fromEntries(nodes.map(n=>[n.name,n.id]));

// inventory style, but it does not pull the entity into the inventory tree's layout.
(ERD.contents || []).forEach(([cn,en])=>{ if(byName[cn]&&byName[en]) allEdges.push({from:byName[en],to:byName[cn],fi:null,req:false,label:'stored in',c:true}); });
(ERD.hierarchy || []).forEach(([p,c])=>{ if(byName[p]&&byName[c]) allEdges.push({from:byName[p],to:byName[c],fi:null,req:true,label:'holds',h:true}); });
const findingsBy = {};
DATA.findings.forEach(f => (findingsBy[f.id] ||= []).push(f));
const SEVR = {high:0,medium:1,low:2,info:3};

const state = {off:new Set(), linksOnly:true, expandAll:false,   // off: ids of schemas taken off the diagram with the category checklists
  sel:null, hover:null, q:'', tx:0, ty:0, k:1, pos:{}};

const vp = document.getElementById('vp'), world = document.getElementById('world'), eg = document.getElementById('eg'), panel = document.getElementById('panel');

// ---------- controls ----------
const catsEl = document.getElementById('cats');
// One chip per category that has schemas on this map; clicking it opens a checklist of that category's schemas.
const catNodes = k => nodes.filter(x=>x.cat===k).sort((a,b)=>a.name.localeCompare(b.name));
Object.entries(CATS).forEach(([k,c]) => {
  if(!catNodes(k).length) return;
  const b = document.createElement('button'); b.className='chipbtn'; b.id='cat-'+k; b.type='button';
  b.setAttribute('aria-haspopup','true'); b.setAttribute('aria-expanded','false');
  b.onclick = e => { e.stopPropagation(); selPopFor===k ? closeSel() : openSel(k); };
  catsEl.appendChild(b);
});
function renderChips(){
  Object.entries(CATS).forEach(([k,c]) => {
    const b = document.getElementById('cat-'+k); if(!b) return;
    const all = catNodes(k), on = all.filter(n=>!state.off.has(n.id)).length;
    b.setAttribute('aria-pressed', String(on>0));
    b.title = `${on} of ${all.length} ${c.label.toLowerCase()} on the diagram · click to choose`;
    b.innerHTML = `<span class="sw" style="background:var(${c.v})"></span>${c.label} <span class="cnt">${on===all.length?all.length:on+'/'+all.length}</span><span class="car" aria-hidden="true">▾</span>`;
  });
}
let selPop = null, selPopFor = null;
function closeSel(){
  if(selPop){ selPop.remove(); selPop=null; }
  if(selPopFor){ const b=document.getElementById('cat-'+selPopFor); if(b) b.setAttribute('aria-expanded','false'); }
  selPopFor = null;
}
function setSelected(ids, on){
  ids.forEach(id => on ? state.off.delete(id) : state.off.add(id));
  if(!on && state.sel && ids.includes(state.sel)){ state.sel=null; renderPanel(); }
  renderChips(); build(false); markDirty();
  if(selPopFor) fillSel(selPopFor);
}
function fillSel(k){
  const all = catNodes(k), on = all.filter(n=>!state.off.has(n.id)).length;
  selPop.innerHTML = `<div class="selhd"><b>${esc(CATS[k].label)}</b><span class="cnt" style="color:var(--muted)">${on} of ${all.length} on the diagram</span></div>`
    + `<label class="all"><input type="checkbox" data-all>Select all</label>`
    + `<div class="sellist">${all.map(n=>`<label title="${esc(n.name)}"><input type="checkbox" data-id="${esc(n.id)}"${state.off.has(n.id)?'':' checked'}><span class="nm">${esc(n.name)}</span></label>`).join('')}</div>`;
  const a = selPop.querySelector('[data-all]'); a.checked = on===all.length; a.indeterminate = on>0 && on<all.length;
  a.onchange = () => setSelected(all.map(n=>n.id), a.checked);
  selPop.querySelectorAll('[data-id]').forEach(i => i.onchange = () => setSelected([i.dataset.id], i.checked));
}
function openSel(k){
  closeSel(); closeDD();
  const b = document.getElementById('cat-'+k); selPopFor = k; b.setAttribute('aria-expanded','true');
  selPop = document.createElement('div'); selPop.className='selpop'; selPop.setAttribute('role','dialog'); selPop.setAttribute('aria-label', CATS[k].label+' on the diagram');
  selPop.addEventListener('pointerdown', e=>e.stopPropagation());
  document.body.appendChild(selPop); fillSel(k);
  const r = b.getBoundingClientRect();
  selPop.style.top = (r.bottom+6)+'px';
  selPop.style.left = Math.max(8, Math.min(r.left, window.innerWidth-selPop.offsetWidth-8))+'px';
}
document.addEventListener('pointerdown', e => { if(selPop && !e.target.closest('#cats')) closeSel(); });
window.addEventListener('resize', closeSel);
renderChips();
const tog = (id,key) => { const b=document.getElementById(id); b.onclick=()=>{ state[key]=!state[key]; b.setAttribute('aria-pressed',state[key]); build(true); }; };
// Compact cards off: every card open at full width with all its fields, as when one card is clicked.
// Expanded cards keep their own arrangement (layouts/<view>-x), so switching never disturbs the compact layout.
document.getElementById('linksOnly').onclick = () => {
  posBy[vk(state.view)] = state.pos;
  state.linksOnly = !state.linksOnly; state.expandAll = !state.linksOnly;
  document.getElementById('linksOnly').setAttribute('aria-checked', String(state.linksOnly));
  state.pos = posBy[vk(state.view)] || {};
  const had = Object.keys(state.pos).length > 0;
  build(!had); if(had) fit();
};
// Findings toggle: hide badges and panel findings for a clean ERD (PNG export follows it)
function setFindings(on){
  document.querySelector('.app').classList.toggle('nofind', !on);
  document.getElementById('showFindings').setAttribute('aria-checked', String(on));
}
document.getElementById('showFindings').onclick = () => {
  const on = document.querySelector('.app').classList.contains('nofind');
  setFindings(on); lsSet('findings', on ? 'on' : 'off');
  drawEdges(); applyHighlight();
};
document.getElementById('q').addEventListener('input', e => { state.q=e.target.value.trim().toLowerCase(); applyHighlight(); });
document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter'){ const m=visible().find(matches); if(m){ select(m.id); centerOn(m.id);} } });

// ---------- visibility ----------
function visibleEdges(vis){ const s=new Set(vis.map(n=>n.id)); return allEdges.filter(e=>s.has(e.from)&&s.has(e.to)); }
function visible(){
  let v = nodes.filter(n=>!state.off.has(n.id) && VIEWCATS[state.view].includes(n.cat));
  return v;
}
function shownFields(n){
  // Compact cards show at least 10 fields: every link field, then the earliest other fields up to 10, in schema order.
  // The selected schema, and any schema with 10 fields or fewer, shows every field.
  const all = n.fields.map((f,i)=>({f,i}));
  if(!state.linksOnly || state.expandAll || n.id===state.sel || all.length<=10) return all;
  const pick = new Set(all.filter(({f})=>LINKISH(f.k)).map(x=>x.i));
  for(const x of all){ if(pick.size>=10) break; pick.add(x.i); }
  return all.filter(x=>pick.has(x.i));
}
const pfxTip = n => n.prefixKind==='barcode' ? 'Barcode prefix' : 'Registry ID prefix';
const matches = n => state.q && (n.name.toLowerCase().includes(state.q) || n.fields.some(f=>f.n.toLowerCase().includes(state.q)) || (n.prefix||'').toLowerCase().includes(state.q));

// ---------- build ----------
function fillCard(el,n){
    const fs = findingsBy[n.id]||[]; const worst = fs.reduce((a,f)=>Math.min(a,SEVR[f.sev]),9);
    const flags = fs.length ? `<div class="flags"><span class="flag ${['high','medium','low','info'][worst]}">${fs.length} finding${fs.length>1?'s':''}</span></div>` : '';
    const sf = shownFields(n);
    const open = n.id===state.sel || state.expandAll;
    const rows = sf.map(({f,i}) => `<div class="row${f.to||f.k==='StorableLink'?' lk':''}${f.dd&&DDOPTS[f.dd]?' dd':''}${openDD.has(n.id+':'+i)?' ddopen':''}" data-fi="${i}" title="${esc(f.n)} — ${esc(KIND[f.k]||f.k)}${f.to?' → '+esc(f.toName):f.hiddenTo?' → '+esc(f.hiddenTo)+' ('+esc(f.offWhy)+', not on this map)':''}${f.dd?' ('+esc(f.dd)+')':''}"><span class="rq${f.req?'':' no'}"></span><span class="fn"><span class="t">${esc(f.n)}</span>${derTag(f)}</span><span class="fk">${f.to?'→ '+esc(f.toName):f.hiddenTo?'→ '+esc(f.hiddenTo)+(open?' ('+esc(f.offWhy)+', not on this map)':''):open&&f.unit?esc(KIND[f.k]||f.k)+' · '+esc(f.unit):esc(KIND[f.k]||f.k)}${open&&f.multi?' · multi':''}</span></div>`).join('');
    const hidden = n.fields.length - sf.length;
    el.classList.toggle('open', open);
    el.innerHTML = `<div class="ch"><div class="cat"><span${etypeTip(n)}>${esc(FAM[n.family]||n.family)}${etype(n)?' · '+esc(etype(n)):''}</span>${n.prefix?`<span class="pf" title="${pfxTip(n)}">${esc(n.prefix)}</span>`:''}</div><div class="cn">${esc(n.name)}</div>${flags}${n.detailError?'<div class="gapflag" title="This schema was listed, but its field details failed to load in this crawl">fields didn\'t load</div>':''}</div>`
      + (n.fields.length ? `<div class="rows">${rows}</div>${hidden?`<div class="more">+ ${hidden} other field${hidden>1?'s':''} · click to show all</div>`:''}` : `<div class="empty">${n.detailError?"Fields didn't load in this crawl":'No fields'}</div>`);
}
let cardEls = {}, curVis = [], curEdges = [];
function build(relayout){
  curVis = visible(); curEdges = visibleEdges(curVis);
  world.querySelectorAll('.card').forEach(c=>c.remove()); cardEls = {};
  curVis.forEach(n => {
    const el = document.createElement('div'); el.className='card'; el.dataset.id=n.id; el.style.setProperty('--cat',`var(${colOf(n)})`); el.style.setProperty('--cat-ink',`var(${colOf(n)}-ink)`);
    fillCard(el,n);
    world.appendChild(el); cardEls[n.id]=el;
    el.addEventListener('mouseenter',()=>{state.hover=n.id;applyHighlight();});
    el.addEventListener('mouseleave',()=>{state.hover=null;applyHighlight();});
    el.addEventListener('click',e=>{ if(el._dragged){el._dragged=false;return;} if(e.target.closest('.opts')) return; const r=e.target.closest('.row.dd'); if(r){ toggleDD(n.id, +r.dataset.fi); return; } select(state.sel===n.id ? null : n.id); });
    dragCard(el,n.id);
  });
  if (relayout || curVis.some(n=>!state.pos[n.id])) layout(relayout);
  place(); drawEdges(); applyHighlight();
  if (relayout) fit();
}
function layout(all){
  // Inventory hierarchy schemas get their own bottom-up tree under the entities (smallest containers on top); everything else flows left to right
  const hier = new Set(curEdges.filter(e=>e.h).flatMap(e=>[e.from,e.to]));
  // Result schemas are stacked together in one column to the right of the graph
  const resSet = new Set(curVis.filter(n=>n.cat==='result' && curEdges.some(e=>!e.h && e.from!==e.to && (e.from===n.id||e.to===n.id))).map(n=>n.id));
  const mainE = curEdges.filter(e=>!e.h && e.from!==e.to && !hier.has(e.from) && !hier.has(e.to) && !resSet.has(e.from) && !resSet.has(e.to));
  const g = new dagre.graphlib.Graph({multigraph:true}); g.setGraph({rankdir:'LR',nodesep:28,ranksep:110,edgesep:12,marginx:20,marginy:20}); g.setDefaultEdgeLabel(()=>({}));
  const linked = new Set(mainE.flatMap(e=>[e.from,e.to]));
  linked.forEach(id=>{ const el=cardEls[id]; g.setNode(id,{width:el.offsetWidth,height:el.offsetHeight}); });
  // results point at the entities they record; draw entity → result direction so registry sits on the left
  mainE.forEach((e,i)=>{ const r = byId[e.from].cat==='result'; g.setEdge(r?e.to:e.from, r?e.from:e.to, {}, 'e'+i); });
  dagre.layout(g);
  let maxY=0, minX=1e9, maxX=0, minY=1e9;
  linked.forEach(id=>{ const el=cardEls[id]; const p=g.node(id);
    if(all || !state.pos[id]) state.pos[id]={x:p.x-el.offsetWidth/2,y:p.y-el.offsetHeight/2};
    const q=state.pos[id]; maxY=Math.max(maxY,q.y+el.offsetHeight); minY=Math.min(minY,q.y); minX=Math.min(minX,q.x); maxX=Math.max(maxX,q.x+el.offsetWidth); });

    const res = [...resSet].sort((a,b)=>ty(a)-ty(b) || byId[a].name.localeCompare(byId[b].name));
    if(minX>maxX){ minX=20; maxX=20; minY=20; maxY=20; }
    const x = maxX+170; let y = minY;
    res.forEach(id=>{ if(all || !state.pos[id]) state.pos[id]={x,y}; y += cardEls[id].offsetHeight+18; });
    maxY = Math.max(maxY,y); maxX = x+cardEls[res[0]].offsetWidth;
  }
  if(hier.size){
    const t = new dagre.graphlib.Graph(); t.setGraph({rankdir:'RL',nodesep:28,ranksep:90,marginx:0,marginy:0});   /* smallest container on the left, largest location on the right */ t.setDefaultEdgeLabel(()=>({}));
    hier.forEach(id=>{ const el=cardEls[id]; t.setNode(id,{width:el.offsetWidth,height:el.offsetHeight}); });
    curEdges.filter(e=>e.h).forEach(e=>t.setEdge(e.from,e.to));
    dagre.layout(t);
    const tw = t.graph().width;
    // optional: keep one inventory branch above another (extras: inventory_top / inventory_bottom)
    const L = ERD.layout || {}, topN = L.inventory_top ? t.node(byName[L.inventory_top]) : null, botN = L.inventory_bottom ? t.node(byName[L.inventory_bottom]) : null;
    const flip = !!(topN && botN && botN.y < topN.y), th = t.graph().height;
    const hasMain = mx1>mx0;
    const ox = hasMain ? mx0+Math.max(0,(mx1-mx0-tw)/2) : 20, oy = hasMain ? maxY+120 : 20;   /* below the registry schemas and the results column */
    hier.forEach(id=>{ const el=cardEls[id], p=t.node(id);
      if(all || !state.pos[id]) state.pos[id]={x:ox+p.x-el.offsetWidth/2,y:oy+(flip?th-p.y:p.y)-el.offsetHeight/2};
      const q=state.pos[id]; maxY=Math.max(maxY,q.y+el.offsetHeight); minX=Math.min(minX,q.x); maxX=Math.max(maxX,q.x+el.offsetWidth); });
  }
  // Schemas with no links: pack them in a grid under the graph, grouped by category
  const iso = curVis.filter(n=>!linked.has(n.id) && !hier.has(n.id) && !resSet.has(n.id)).sort((a,b)=>Object.keys(CATS).indexOf(a.cat)-Object.keys(CATS).indexOf(b.cat)||a.name.localeCompare(b.name));
  if(!iso.length) return;
  if(minX>maxX){ minX=20; maxX=1100; }
  const colW=270, cols=Math.max(4,Math.floor((maxX-minX+20)/colW)), y0=maxY+(linked.size?80:20);
  const colH=new Array(cols).fill(y0);
  iso.forEach((n,i)=>{ const c=colH.indexOf(Math.min(...colH)); if(all || !state.pos[n.id]) state.pos[n.id]={x:minX+c*colW,y:colH[c]}; colH[c]+=cardEls[n.id].offsetHeight+16; });
}
function place(){ curVis.forEach(n=>{ const p=state.pos[n.id], el=cardEls[n.id]; el.style.left=p.x+'px'; el.style.top=p.y+'px'; }); }

function anchor(id, fi){
  const el=cardEls[id], p=state.pos[id]; const w=el.offsetWidth;
  let y = p.y + 22;
  if (fi!=null){ const r=el.querySelector(`.row[data-fi="${fi}"]`); y = r ? p.y + r.offsetTop + r.offsetHeight/2 : p.y + el.querySelector('.ch').offsetHeight/2; }
  return {l:p.x, r:p.x+w, y, cx:p.x+w/2};
}
// ---------- link styles ----------
const lsGet = k => { try{ return localStorage.getItem('erd.'+k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem('erd.'+k,v); }catch(e){} };
const LINK = { shape: lsGet('shape') || 'elbow', head: lsGet('head') || 'erd' };
// horiz: the link leaves and enters along x; dir is +1 or -1 along that axis
function route(sx,sy,tx,ty,horiz,dir){
  const sh = LINK.shape;
  if(sh==='straight') return `M${sx} ${sy} L${tx} ${ty}`;
  // work in (a = main axis, b = cross axis) and map back
  const A0=horiz?sx:sy, B0=horiz?sy:sx, A1=horiz?tx:ty, B1=horiz?ty:tx;
  const P=(a,b)=>horiz?`${a} ${b}`:`${b} ${a}`;

function paintThemeBtn(){ const dark = curTheme()==='dark'; themeBtn.innerHTML = dark ? '<span aria-hidden="true">☀</span> Light mode' : '<span aria-hidden="true">☾</span> Dark mode'; themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode'); }
themeBtn.onclick = () => { const t = curTheme()==='dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); lsSet('theme', t); paintThemeBtn(); };
{ const saved = lsGet('theme'); if(saved==='light'||saved==='dark') document.documentElement.setAttribute('data-theme', saved); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn); }catch(e){}
paintThemeBtn();
// ---------- collapsible side panel (remembered per browser) ----------
// open: a small » button in the panel's corner hides it; closed: a slim "Details" rail on the right edge brings it back
const mainEl = document.querySelector('.main'), panelClose = document.getElementById('panelclose'), panelRail = document.getElementById('panelrail');
function setPanel(open, save){
  mainEl.classList.toggle('pclosed', !open);
  panelRail.hidden = open;
  panelRail.setAttribute('aria-expanded', String(open)); panelClose.setAttribute('aria-expanded', String(open));
  if(save) lsSet('panel', open ? 'open' : 'closed');
}
panelClose.onclick = () => setPanel(false, true);
panelRail.onclick = () => setPanel(true, true);
setPanel(lsGet('panel') !== 'closed', false);
if(lsGet('findings')==='off'){ setFindings(false); drawEdges(); applyHighlight(); }
// ---------- saved card arrangement ----------
// On a published map the arrangement lives in the artifact's db (layouts/<tab>), so everyone the map is
// shared with sees it and it survives regenerating the page. Only Editors and the owner can save it
// (rule: write "admin"); others can still drag, but nothing is kept. Opened as a local file, it saves
// to this browser. New schemas without a saved position are placed automatically.
const saveBtn = document.getElementById('savelayout');
const LKEY = 'erd.layout.' + (ERD.meta.registryId || '');
let layoutDb = null, layoutDirty = false;
function markDirty(){ layoutDirty = true; saveBtn.classList.add('dirty'); saveBtn.title = 'Save view (unsaved changes)'; }
function flashSave(text){ saveBtn.textContent = text; setTimeout(()=>{ saveBtn.innerHTML = 'SAVE<br>VIEW'; }, 1800); }
const roundPos = o => Object.fromEntries(Object.entries(o || {}).map(([k,p]) => [k, {x:Math.round(p.x), y:Math.round(p.y)}]));
async function saveLayout(){
  if(!layoutDirty){ flashSave('✓'); return; }
  const all = {...posBy, [vk(state.view)]: state.pos};
  saveBtn.disabled = true;
  try{
    if(layoutDb){
      for(const v of Object.keys(all)) await layoutDb.doc('layouts/' + v).set({positions: roundPos(all[v]), savedAt: new Date().toISOString()});
      await layoutDb.doc('layouts/selection').set({off: [...state.off], savedAt: new Date().toISOString()});
    } else {
      localStorage.setItem(LKEY, JSON.stringify({savedAt: new Date().toISOString(), off: [...state.off], views: Object.fromEntries(Object.entries(all).map(([v,o]) => [v, roundPos(o)]))}));
    }
    layoutDirty = false; saveBtn.classList.remove('dirty'); saveBtn.title = 'Save view: card arrangement and which schemas are shown'; flashSave('✓');
  }catch(e){
    if(e && e.code === 'invalid_argument'){ saveBtn.hidden = true; }   // this viewer may not save the shared layout
    flashSave('✗');
  }
  saveBtn.disabled = false;
}
saveBtn.onclick = saveLayout;
function applySaved(saved){
  Object.entries(saved || {}).forEach(([v, pos]) => {
    if(!pos || typeof pos !== 'object') return;
    if(v === vk(state.view)){ if(layoutDirty) return; state.pos = {...state.pos, ...pos}; place(); drawEdges(); applyHighlight(); fit(); }
    else if(VIEWCATS[v.replace(/-x$/, '')]) posBy[v] = {...(posBy[v] || {}), ...pos};
  });
}
async function initLayout(){
  // Candidates per tab: positions embedded by "Download HTML" (ERD.positions), then the shared db
  // (published map) or this browser (local file). The newest save wins.
  const best = {};
  const offer = (views, at) => Object.entries(views || {}).forEach(([v, pos]) => {
    if(pos && typeof pos === 'object' && (!best[v] || (at || '') > best[v].at)) best[v] = {pos, at: at || ''};
  });
  offer(ERD.positions, ERD.positionsSavedAt);
  // which schemas are off the diagram is saved with the arrangement; the newest save wins here too
  let sel = Array.isArray(ERD.off) ? {off: ERD.off, at: ERD.positionsSavedAt || ''} : null;
  const offerSel = (off, at) => { if(Array.isArray(off) && (!sel || (at || '') > sel.at)) sel = {off, at: at || ''}; };
  let db = null;
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(db){
    layoutDb = db;
    let canSave = false;
    try{ const u = await window.claude.use('user'); canSave = u ? await u.canEdit() : false; }catch(e){}
    for(const v of Object.keys(VIEWCATS).flatMap(k => [k, k + '-x'])){
      try{ const snap = await db.doc('layouts/' + v).get(); if(snap.exists){ const d = snap.data() || {}; offer({[v]: d.positions}, d.savedAt); } }catch(e){}
    }
    try{ const snap = await db.doc('layouts/selection').get(); if(snap.exists){ const d = snap.data() || {}; offerSel(d.off, d.savedAt); } }catch(e){}
    saveBtn.hidden = !canSave;
  } else {
    try{ const l = JSON.parse(localStorage.getItem(LKEY) || '{}'); offer(l.views, l.savedAt); offerSel(l.off, l.savedAt); }catch(e){}
    saveBtn.hidden = false;
  }
  if(sel && !layoutDirty){
    // ids no longer in the crawl are dropped; schemas new since the save start on the diagram
    state.off = new Set(sel.off.filter(id => byId[id]));
    if(state.sel && state.off.has(state.sel)){ state.sel = null; renderPanel(); }
    renderChips(); build(false);
  }
  applySaved(Object.fromEntries(Object.entries(best).map(([v, b]) => [v, b.pos])));
  // Download needs the downloads capability on a published map; a local file downloads directly
  if(window.claude && window.claude.use){
    try{ exportDl = await window.claude.use('downloads'); }catch(e){ exportDl = null; }
    exportBtn.hidden = !exportDl; pngBtn.hidden = !exportDl;
  }
}
// ---------- Download HTML with the current card arrangement ----------
const exportBtn = document.getElementById('exporthtml');
let exportDl = null;
function buildExport(){
  const views = Object.fromEntries(Object.entries({...posBy, [vk(state.view)]: state.pos}).map(([v,o]) => [v, roundPos(o)]));
  const json = JSON.stringify({...ERD, positions: views, off: [...state.off], positionsSavedAt: new Date().toISOString()}).replace(/<\//g, '<\\/');
  const main = document.getElementById('erd-main').textContent.replace(/^const ERD = .*;$/m, () => 'const ERD = ' + json + ';');
  const style = document.getElementById('erd-style').textContent;
  return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
    + '<title>' + esc(document.title) + '</title><meta name="claude:viewport-fit-sides" content="cover">'
    + document.getElementById('erd-fonts').outerHTML
    + '<style>body{margin:0}[hidden]{display:none!important}</style><style id="erd-style">' + style + '</style></head><body>'
    + PRISTINE_APP
    + '<script id="erd-dagre">' + document.getElementById('erd-dagre').textContent + '<\/script><script id="erd-main">' + main + '<\/script></body></html>\n';
}
async function exportHtml(){
  const html = buildExport();
  const filename = (ERD.meta.registryShort || 'registry').replace(/[^A-Za-z0-9._-]+/g, '-') + '-schema-map.html';
  if(exportDl){
    try{ await exportDl.save({filename, data: html}); }
    catch(e){ if(e && e.code !== 'declined'){ exportBtn.title = 'Download is not available here'; } }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type: 'text/html'})); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
exportBtn.onclick = exportHtml;
// ---------- Download PNG: just the diagram (cards and links) in the current arrangement ----------
// Drawn onto a canvas from the live layout (positions, colours and fonts as rendered), so it needs no
// screenshot library and works inside Claude's page frame.
const pngBtn = document.getElementById('exportpng');
const pxv = v => parseFloat(v) || 0;
const seen = c => c && c !== 'transparent' && c !== 'rgba(0, 0, 0, 0)' && c !== 'none';
function rrect(ctx, x, y, w, h, r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function drawBox(ctx, el, ox, oy){
  const cs = getComputedStyle(el); const b = el.getBoundingClientRect();
  if(cs.display === 'none' || cs.visibility === 'hidden' || !b.width || !b.height) return false;
  const x = b.left - ox, y = b.top - oy, w = b.width, h = b.height;
  const rad = [cs.borderTopLeftRadius, cs.borderTopRightRadius, cs.borderBottomRightRadius, cs.borderBottomLeftRadius].map(pxv);
  if(seen(cs.backgroundColor)){ ctx.fillStyle = cs.backgroundColor; rrect(ctx, x, y, w, h, rad); ctx.fill(); }
  const sides = ['Top','Right','Bottom','Left'].map(sd => ({w: pxv(cs['border'+sd+'Width']), c: cs['border'+sd+'Color'], s: cs['border'+sd+'Style']}));
  const dash = st => st === 'dashed' ? [4,3] : st === 'dotted' ? [1,2] : [];
  if(sides.every(sd => sd.w === sides[0].w && sd.c === sides[0].c && sd.s === sides[0].s)){
    const sd = sides[0];
    if(sd.w > 0 && sd.s !== 'none' && seen(sd.c)){ ctx.save(); ctx.strokeStyle = sd.c; ctx.lineWidth = sd.w; ctx.setLineDash(dash(sd.s)); const k = sd.w/2; rrect(ctx, x+k, y+k, w-sd.w, h-sd.w, rad.map(v => Math.max(0, v-k))); ctx.stroke(); ctx.restore(); }
  } else sides.forEach((sd, i) => {
    if(sd.w <= 0 || sd.s === 'none' || !seen(sd.c)) return;
    const k = sd.w/2; ctx.save(); ctx.strokeStyle = sd.c; ctx.lineWidth = sd.w; ctx.setLineDash(dash(sd.s)); ctx.beginPath();
    if(i===0){ ctx.moveTo(x, y+k); ctx.lineTo(x+w, y+k); } else if(i===1){ ctx.moveTo(x+w-k, y); ctx.lineTo(x+w-k, y+h); }
    else if(i===2){ ctx.moveTo(x, y+h-k); ctx.lineTo(x+w, y+h-k); } else { ctx.moveTo(x+k, y); ctx.lineTo(x+k, y+h); }
    ctx.stroke(); ctx.restore(); });
  return true;
}
function drawText(ctx, node, ox, oy){
  const raw = node.textContent; if(!raw.trim()) return;
  const el = node.parentElement, cs = getComputedStyle(el), box = el.getBoundingClientRect();
  const up = cs.textTransform === 'uppercase';
  ctx.save(); ctx.fillStyle = cs.color; ctx.textBaseline = 'middle';
  ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  if('letterSpacing' in ctx) ctx.letterSpacing = cs.letterSpacing === 'normal' ? '0px' : cs.letterSpacing;
  const ellip = cs.textOverflow === 'ellipsis' && el.scrollWidth > el.clientWidth + 1;
  const range = document.createRange(); const re = /\S+/g; let m;
  while((m = re.exec(raw))){
    range.setStart(node, m.index); range.setEnd(node, m.index + m[0].length);
    const r = range.getClientRects()[0]; if(!r) continue;
    let word = up ? m[0].toUpperCase() : m[0];
    if(ellip && r.left >= box.right - 2) break;
    if(ellip && r.right > box.right + 0.5){
      const room = box.right - r.left;
      while(word.length && ctx.measureText(word + '…').width > room) word = word.slice(0, -1);
      ctx.fillText(word + '…', r.left - ox, r.top - oy + r.height/2); break;
    }
    ctx.fillText(word, r.left - ox, r.top - oy + r.height/2);
  }
  ctx.restore();
}
function drawTree(ctx, el, ox, oy){
  if(!drawBox(ctx, el, ox, oy)) return;
  el.childNodes.forEach(n => { if(n.nodeType === 3) drawText(ctx, n, ox, oy); else if(n.nodeType === 1) drawTree(ctx, n, ox, oy); });
}
function drawMarker(ctx, p, which){
  const ref = (p.getAttribute('marker-' + which) || '').match(/#([^)]+)/); if(!ref) return;
  const mk = document.getElementById(ref[1]); if(!mk) return;
  const L = p.getTotalLength(); if(!L) return;
  const pt = p.getPointAtLength(which === 'end' ? L : 0), q = p.getPointAtLength(which === 'end' ? Math.max(0, L-1) : Math.min(L, 1));
  const ang = Math.atan2(pt.y - q.y, pt.x - q.x);   // end: direction of travel; start (auto-start-reverse): pointing back out
  const vb = mk.viewBox.baseVal, sx = +mk.getAttribute('markerWidth') / vb.width, sy = +mk.getAttribute('markerHeight') / vb.height;
  ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(ang); ctx.scale(sx, sy); ctx.translate(-(+mk.getAttribute('refX')), -(+mk.getAttribute('refY')));
  [...mk.children].forEach(c => {
    const cs = getComputedStyle(c); let path;
    if(c.tagName === 'path') path = new Path2D(c.getAttribute('d'));
    else if(c.tagName === 'circle'){ path = new Path2D(); path.arc(+c.getAttribute('cx'), +c.getAttribute('cy'), +c.getAttribute('r'), 0, Math.PI*2); }
    if(!path) return;
    if(seen(cs.fill)){ ctx.fillStyle = cs.fill; ctx.fill(path); }
    if(seen(cs.stroke) && pxv(cs.strokeWidth) > 0){ ctx.strokeStyle = cs.stroke; ctx.lineWidth = pxv(cs.strokeWidth); ctx.lineJoin = cs.strokeLinejoin; ctx.lineCap = cs.strokeLinecap; ctx.stroke(path); }
  });
  ctx.restore();
}
async function exportPng(){
  pngBtn.disabled = true;
  const keep = {sel: state.sel, hover: state.hover, q: state.q, t: world.style.transform};
  try{
    // draw an undimmed diagram at scale 1
    // draw the arrangement as saved: nothing selected, highlighted or expanded by a click
    state.hover = null; state.q = '';
    if(keep.sel){ state.sel = null; if(cardEls[keep.sel]) fillCard(cardEls[keep.sel], byId[keep.sel]); drawEdges(); }
    applyHighlight();
    world.style.transform = 'none';
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const wr = world.getBoundingClientRect(), ox = wr.left, oy = wr.top;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const grow = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
    curVis.forEach(n => { const r = cardEls[n.id].getBoundingClientRect(); grow(r.left-ox, r.top-oy, r.right-ox, r.bottom-oy); });
    const paths = [...eg.querySelectorAll('path')];
    paths.forEach(p => { const bb = p.getBBox(); grow(bb.x - 12, bb.y - 12, bb.x + bb.width + 12, bb.y + bb.height + 12); });
    if(x0 > x1) return;
    const pad = 32, W = x1 - x0 + pad*2;
    // a partial crawl carries its warning into the image, so a shared PNG can't pass as complete
    const note = document.getElementById('partial'), band = [];
    const bandFont = '500 13px ' + getComputedStyle(document.body).fontFamily;
    if(note){
      const m = document.createElement('canvas').getContext('2d'); m.font = bandFont;
      const maxW = Math.max(180, W - 32); let line = '';
      ('⚠ ' + note.textContent.replace(/\s+/g, ' ').trim()).split(' ').forEach(w => {
        const t = line ? line + ' ' + w : w;
        if(m.measureText(t).width > maxW && line){ band.push(line); line = w; } else line = t;
      });
      if(line) band.push(line);
    }
    const bandH = band.length ? band.length * 19 + 22 : 0, H = y1 - y0 + pad*2 + bandH;
    const scale = Math.max(1, Math.min(2, 8000 / W, 8000 / H));
    const cv = document.createElement('canvas'); cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
    const ctx = cv.getContext('2d'); ctx.scale(scale, scale);
    ctx.fillStyle = getComputedStyle(document.body).backgroundColor; ctx.fillRect(0, 0, W, H);
    if(bandH){
      const ns = getComputedStyle(note);
      ctx.fillStyle = ns.backgroundColor; ctx.fillRect(0, 0, W, bandH);
      ctx.fillStyle = ns.borderBottomColor; ctx.fillRect(0, bandH - 1, W, 1);
      ctx.fillStyle = ns.color; ctx.font = bandFont; ctx.textBaseline = 'top';
      band.forEach((l, i) => ctx.fillText(l, 16, 11 + i * 19));
    }
    ctx.translate(pad - x0, pad - y0 + bandH);
    paths.forEach(p => {
      const cs = getComputedStyle(p); if(cs.display === 'none') return;
      ctx.save(); ctx.strokeStyle = cs.stroke; ctx.lineWidth = pxv(cs.strokeWidth); ctx.lineCap = cs.strokeLinecap; ctx.lineJoin = cs.strokeLinejoin;
      ctx.setLineDash(cs.strokeDasharray && cs.strokeDasharray !== 'none' ? cs.strokeDasharray.split(/[ ,]+/).map(pxv) : []);
      ctx.stroke(new Path2D(p.getAttribute('d'))); ctx.restore();
      drawMarker(ctx, p, 'start'); drawMarker(ctx, p, 'end');
    });
    curVis.forEach(n => drawTree(ctx, cardEls[n.id], ox, oy));
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    const view = {all: 'data-model', model: 'registry', inventory: 'inventory'}[state.view] || state.view;
    const filename = (ERD.meta.registryShort || 'registry').replace(/[^A-Za-z0-9._-]+/g, '-') + '-' + view + '.png';
    if(exportDl){ try{ await exportDl.save({filename, data: blob}); }catch(e){ if(e && e.code !== 'declined') pngBtn.title = 'Download is not available here'; } }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
  } finally {
    world.style.transform = keep.t; state.hover = keep.hover; state.q = keep.q;
    if(keep.sel){ state.sel = keep.sel; if(cardEls[keep.sel]) fillCard(cardEls[keep.sel], byId[keep.sel]); drawEdges(); }
    applyHighlight();
    pngBtn.disabled = false;
  }
}
pngBtn.onclick = exportPng;
function start(){ setView(state.view, true); renderPanel(); initLayout(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
</script>
