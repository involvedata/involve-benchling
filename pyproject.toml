[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "involve-benchling"
description = "The toolkit the official Benchling SDK doesn't give you: caching, resolution, workflow tools, and testing utilities on top of the Benchling V3 API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Involve Data" }]
keywords = ["benchling", "api", "sdk", "biology", "biotech", "laboratory", "lims"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "benchling-v3-sdk-python>=15.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
testing = ["pytest>=8.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas>=2.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/involvedata/involve-benchling"
Repository = "https://github.com/involvedata/involve-benchling.git"

[project.entry-points.pytest11]
involve_benchling = "involve_benchling.testing.plugin"

[tool.hatch.version]
path = "src/involve_benchling/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/involve_benchling"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["involve_benchling"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["benchling_v3_sdk.*", "benchling_v3_sdk_python.*", "diskcache.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit a real Benchling tenant (require credentials)",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["involve_benchling"]
